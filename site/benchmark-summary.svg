<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
<title id="title">event-pubsub dispatch execution latency</title>
<desc id="description">Typed emit · 1 handler: 9.97 nanoseconds per emit, 100.3 million emits per second. Typed emit · 5 handlers: 17.16 nanoseconds per emit, 58.27 million emits per second. Typed emit · 20 handlers: 42.17 nanoseconds per emit, 23.71 million emits per second. Wildcard + typed emit: 26.91 nanoseconds per emit, 37.16 million emits per second. Lower latency is better. Setup, warmup, validation, verification, reporting, and file input/output are excluded.</desc>
<style>
    .background { fill: #050914; }
    .title, .label, .value { fill: #f8fbff; font-family: ui-sans-serif, system-ui, sans-serif; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle, .work, .tick, .provenance { fill: #aab8cc; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .subtitle { font-size: 17px; }
    .label { font-size: 18px; font-weight: 650; }
    .work { font-size: 13px; }
    .value { font-size: 15px; font-weight: 650; }
    .tick, .provenance { font-size: 13px; }
    .grid { stroke: #27344b; stroke-width: 1; }
    .track { fill: #152038; }
    .bar { fill: #22d3ee; }
    .interval, .whisker { stroke: #fbbf24; stroke-width: 4; }
    .whisker { stroke-width: 2; }
    .sample { fill: #f8fbff; stroke: #050914; stroke-width: 2; }
</style>
