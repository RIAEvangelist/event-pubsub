name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-pubsub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - '22.12.0'
          - '24'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all 90 tests
        run: npm test

      - name: Validate the 16-page site
        run: npm run site:check

  coverage:
    name: Native V8 coverage / Node 24.18.0 + Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VANILLA_TEST_CHROME_NO_SANDBOX: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install Google Chrome Stable
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Run Node and real-Chrome coverage
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run coverage -- --chrome-path "$CHROME_PATH"

      - name: Upload independent runtime reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-v8-coverage
          path: coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  package-smoke:
    name: Packed npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Audit development dependencies
        run: npm audit --audit-level=high

      - name: Verify zero production dependencies
        run: npm ls --omit=dev --all

      - name: Pack, install, and exercise a clean consumer
        run: npm run test:package

      - name: Create inspectable package artifact
        run: npm pack --silent

      - name: Upload packed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: event-pubsub-6-package
          path: event-pubsub-*.tgz
          if-no-files-found: error
          retention-days: 14

  benchmark:
    name: Validated benchmark / Node 24.18.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Run eight validated hot-path scenarios
        run: npm run benchmark

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: event-pubsub-benchmark
          path: benchmark/results.json
          if-no-files-found: error
          retention-days: 14

  pages:
    name: Assemble GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - test
      - coverage
      - package-smoke
      - benchmark
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Node and Chrome coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-v8-coverage
          path: coverage

      - name: Download fresh benchmark evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: event-pubsub-benchmark
          path: benchmark

      - name: Validate and assemble the focused site
        run: |
          npm run site:check
          npm run site:assemble
          npm run site:deployment-check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
